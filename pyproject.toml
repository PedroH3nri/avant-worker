[project]
name = "avant-worker"
version = "0.3.0"
description = "Worker e agendador (Celery) do Groone Avant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "avant-core",
    "celery[redis]>=5.4,<6",
    "google-auth>=2.35",
    "googleads>=50",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "redis>=5.2",
]

[tool.uv.sources]
# Sempre por tag: atualizar o avant-core é uma mudança explícita neste repositório.
avant-core = { git = "https://github.com/PedroH3nri/avant-core", tag = "v0.46.0" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "celery-types>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avant_worker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Skills de terceiros versionadas em docs/skills: não são código do projeto.
extend-exclude = ["docs/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# O googleads não tem tipos; o uso fica restrito a gam_reports.py.
module = ["googleads", "googleads.*"]
ignore_missing_imports = true
