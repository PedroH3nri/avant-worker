version: 2
updates:
  - package-ecosystem: docker
    directory: /
    target-branch: pre-develop
    schedule:
      interval: weekly
    groups:
      imagens:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    target-branch: pre-develop
    schedule:
      interval: weekly
    # O avant-core é nosso: a versão sobe pela skill avant-lancar-versao.
    ignore:
      - dependency-name: avant-core
    groups:
      dependencias:
        patterns: ["*"]
        update-types: ["minor", "patch"]
